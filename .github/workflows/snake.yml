name: Generate Animal Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate capybara calendar SVGs (dark + light)
        run: |
          python3 scripts/generate_animal_snake.py --user Serennity007 \
            --theme dark --out dist --out-name animal-snake-dark
          python3 scripts/generate_animal_snake.py --user Serennity007 \
            --theme light --out dist --out-name animal-snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
