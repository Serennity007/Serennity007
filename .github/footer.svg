<svg width="1120" height="150" viewBox="0 0 1120 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer wave: thanks for visiting — leave a star on the repo that saved you time">
  <title>thanks for visiting</title>
  <desc>Animated cyan-purple footer wave. Text: Thanks for visiting — leave a star on the repo that saved you time.</desc>
  <defs>
    <linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fgrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- back wave: slower drift, dimmer -->
  <path fill="url(#fgrad2)" d="M0 92 C 140 62, 280 122, 420 92 S 700 62, 840 92 S 1120 122, 1260 92 L 1260 150 L 0 150 Z">
    <animateTransform attributeName="transform" type="translate" values="0 0; -140 0; 0 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <!-- front wave: faster drift -->
  <path fill="url(#fgrad)" d="M-140 108 C 0 78, 140 138, 280 108 S 560 78, 700 108 S 980 138, 1120 108 L 1120 150 L -140 150 Z">
    <animateTransform attributeName="transform" type="translate" values="0 0; 140 0; 0 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <text x="560" y="66" text-anchor="middle" font-family="JetBrains Mono, Consolas, Courier New, monospace" font-size="21" font-weight="600" fill="#00d4ff" opacity="0">Thanks for visiting<tspan fill="#8b5cf6"> · </tspan><tspan fill="#e8eaf6">leave a ⭐ on the repo that saved you time</tspan>
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
